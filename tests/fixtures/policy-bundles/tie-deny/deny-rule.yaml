version: 1
id: deny-rule
description: Equal priority fixture rule denies the action
priority: 100
match:
  tool: fixture.tie-deny
  principal: {kind: agent, id: [fixture-agent]}
conditions:
  - {id: blocked, expr: "false", on_fail: deny}
effect: {when_all_true: allow, combine: most_restrictive}
escalation: null
obligations: []
