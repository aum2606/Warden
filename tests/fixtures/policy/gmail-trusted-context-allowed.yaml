  authority_chain: [user:aum, agent:orchestrator, agent:ops-worker]
  tool: gmail.send
  params:
    to: [reviewer@acme.example]
    subject: Trusted review
    attachment_count: 2
  context:
    min_trust: trusted
    sources: [chunk-trusted]
