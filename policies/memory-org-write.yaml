version: 1
id: memory-org-write
description: Organization-scoped memory writes require approval
priority: 100
match:
  tool: memory.write
  principal:
    kind: agent
    id: ["*"]
conditions:
  - id: non-org-scope
    expr: 'params.scope in ["run", "agent"]'
    on_fail: escalate
effect:
  when_all_true: allow
  combine: most_restrictive
escalation:
  approvers: [role:approver]
  ttl_seconds: 900
  show:
    - params.scope
    - params.key
    - params.value
    - context.sources
obligations: []
