version: 1
id: default-deny
description: Actions not authorized by a more specific rule are denied
priority: -1000000
match:
  tool: "*"
  principal:
    kind: "*"
    id: ["*"]
conditions:
  - id: default-deny
    expr: "false"
    on_fail: deny
effect:
  when_all_true: allow
  combine: most_restrictive
escalation: null
obligations: []
